<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能文档检索系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ai-highlight {
            background: linear-gradient(120deg, #e0f7fa 0%, #f3e5f5 100%);
            border-left: 4px solid #7e22ce;
        }
        .rerank-indicator {
            background-color: #f0f9ff;
            border-left: 4px solid #0ea5e9;
        }
        .markdown-style {
            line-height: 1.6;
        }
        .markdown-style p {
            margin-bottom: 1em;
        }
        .markdown-style ul {
            list-style-type: disc;
            padding-left: 2em;
            margin-bottom: 1em;
        }
        .filter-card {
            background: linear-gradient(120deg, #f0f9ff 0%, #e6f7ff 100%);
            border-left: 4px solid #0ea5e9;
        }
        .line-clamp-2 {
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            
            /* Added standard property */
            line-clamp: 2;
        }
        .context-card {
            background: linear-gradient(120deg, #fffaf0 0%, #fff5e6 100%);
            border-left: 4px solid #f59e0b;
        }
        .feature-badge {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            margin-right: 0.25rem;
            margin-bottom: 0.25rem;
        }
        .constraint-tag {
            display: inline-flex;
            align-items: center;
            background-color: #f0fdf4;
            color: #166534;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .constraint-tag button {
            margin-left: 0.25rem;
            color: #166534;
            background: none;
            border: none;
            cursor: pointer;
        }
        .chat-bubble-user {
            background: linear-gradient(120deg, #dbeafe 0%, #eff6ff 100%);
            border-radius: 1rem 1rem 0 1rem;
            max-width: 85%;
        }
        .chat-bubble-ai {
            background: linear-gradient(120deg, #f0fdf4 0%, #dcfce7 100%);
            border-radius: 1rem 1rem 1rem 0;
            max-width: 85%;
        }
        .project-code {
            font-family: monospace;
            background-color: #f3f4f6;
            padding: 0.15rem 0.3rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
            color: #4b5563;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen font-sans">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-book-open text-indigo-600 text-xl mr-2"></i>
                    <span class="text-xl font-semibold text-gray-800">智能文档检索系统</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="#" class="text-gray-600 hover:text-indigo-600 transition">首页</a>
                    <a href="#" class="text-gray-600 hover:text-indigo-600 transition">文档</a>
                    <a href="#" class="text-gray-600 hover:text-indigo-600 transition">关于</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 上传卡片 -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-8 card-hover">
            <div class="p-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fas fa-cloud-upload-alt text-indigo-500 mr-2"></i>
                    上传文档
                </h2>
                <form id="uploadForm" enctype="multipart/form-data" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">项目名称</label>
                        <input type="text" name="project_name" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                    </div>
                    
                    <!-- 新增项目编号输入框 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">项目编号</label>
                        <input type="text" name="project_code" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                               placeholder="例如: PRJ-2023-001">
                        <p class="text-xs text-gray-500 mt-1">项目的唯一标识符</p>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">项目开始日期</label>
                        <input type="date" name="project_date"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                        <p class="text-xs text-gray-500 mt-1">格式：YYYY-MM-DD</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">选择文档</label>
                        <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg">
                            <div class="space-y-1 text-center">
                                <div class="flex text-sm text-gray-600">
                                    <label class="relative cursor-pointer bg-white rounded-md font-medium text-indigo-600 hover:text-indigo-500 focus-within:outline-none">
                                        <span>上传文件</span>
                                        <input type="file" name="files" multiple required class="sr-only">
                                    </label>
                                    <p class="pl-1">或将文件拖拽到此处</p>
                                </div>
                                <p class="text-xs text-gray-500">支持.docx格式文档</p>
                            </div>
                        </div>
                    </div>
                    <button type="submit" 
                            class="w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition flex items-center justify-center">
                        <i class="fas fa-upload mr-2"></i> 上传并处理
                    </button>
                </form>
            </div>
        </div>

        <!-- 上下文状态卡片 -->
        <div id="contextCard" class="context-card rounded-xl shadow-md overflow-hidden mb-8 fade-in">
            <div class="p-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fas fa-filter text-amber-500 mr-2"></i>
                    当前筛选条件
                </h2>
                <div id="contextInfo" class="text-sm text-gray-600 mb-4">
                    <div id="constraintTags">
                        <p>无筛选条件（所有项目）</p>
                    </div>
                </div>
                <div class="mt-4">
                    <button id="clearContextBtn" 
                            class="bg-amber-100 text-amber-800 hover:bg-amber-200 py-2 px-4 rounded-lg transition flex items-center">
                        <i class="fas fa-times-circle mr-2"></i> 清除所有筛选条件
                    </button>
                </div>
            </div>
        </div>

        <!-- 项目筛选卡片 -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-8 filter-card fade-in">
            <div class="p-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fas fa-filter-circle-dollar text-blue-500 mr-2"></i>
                    项目筛选
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">项目名称/编号</label>
                        <div class="flex">
                            <input type="text" id="projectNameFilter" 
                                   class="flex-grow px-4 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                                   placeholder="输入项目名称或编号...">
                            <button id="addProjectFilterBtn"
                                    class="bg-blue-100 text-blue-800 px-4 py-2 rounded-r-lg hover:bg-blue-200 transition">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">项目特点</label>
                        <div class="flex">
                            <input type="text" id="projectFeatureFilter" 
                                   class="flex-grow px-4 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                                   placeholder="输入项目特点...">
                            <button id="addFeatureFilterBtn"
                                    class="bg-blue-100 text-blue-800 px-4 py-2 rounded-r-lg hover:bg-blue-200 transition">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">项目时间范围</label>
                        <div class="flex">
                            <input type="text" id="projectTimeFilter" 
                                   class="flex-grow px-4 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                                   placeholder="例如：2018-2023年...">
                            <button id="addTimeFilterBtn"
                                    class="bg-blue-100 text-blue-800 px-4 py-2 rounded-r-lg hover:bg-blue-200 transition">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div id="filterResults" class="mt-4 min-h-[60px]">
                    <!-- 筛选结果提示将显示在这里 -->
                </div>
            </div>
        </div>

        <!-- 项目与搜索区 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 项目列表 -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-md overflow-hidden card-hover">
                    <div class="p-6">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                            <i class="fas fa-folder-open text-indigo-500 mr-2"></i>
                            项目列表
                        </h2>
                        <div class="mb-4 relative">
                            <input type="text" id="projectSearch" placeholder="搜索项目..." 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                            <i class="fas fa-search absolute right-3 top-2.5 text-gray-400"></i>
                        </div>
                        <div id="projectsContainer" class="space-y-2 max-h-[50vh] overflow-y-auto pr-1">
                            <!-- 项目卡片将通过JS动态生成 -->
                            <div class="text-center py-8">
                                <i class="fas fa-spinner fa-spin text-gray-400 text-2xl"></i>
                                <p class="mt-2 text-gray-500">加载中...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 搜索与聊天区 -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow-md overflow-hidden card-hover h-full flex flex-col">
                    <div class="p-6 flex-grow flex flex-col">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                            <i class="fas fa-comments text-indigo-500 mr-2"></i>
                            问答与检索
                        </h2>
                        
                        <!-- 聊天记录区域 -->
                        <div id="chatHistory" class="flex-grow overflow-y-auto mb-4 space-y-4 max-h-[50vh]">
                            <div class="text-center py-8 text-gray-500">
                                <i class="fas fa-comment-dots text-2xl"></i>
                                <p class="mt-2">开始提问以获取信息</p>
                            </div>
                        </div>
                        
                        <!-- 提问输入 -->
                        <div class="mb-6">
                            <div class="flex">
                                <input type="text" id="questionInput" 
                                       class="flex-grow px-4 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                                       placeholder="输入您的问题...">
                                <button id="sendQuestionBtn"
                                        class="bg-indigo-600 text-white px-4 py-2 rounded-r-lg hover:bg-indigo-700 transition">
                                    <i class="fas fa-paper-plane"></i>
                                </button>
                            </div>
                            <p class="mt-1 text-xs text-gray-500">
                                支持各类问题：项目查询、文档检索、特征统计等
                            </p>
                        </div>

                        <!-- 搜索选项 -->
                        <form id="searchForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">搜索参数</label>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="flex items-center">
                                        <input type="checkbox" name="rerank" id="rerankCheckbox" value="true"
                                               class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                                        <label for="rerankCheckbox" class="ml-2 block text-sm text-gray-700">启用重排序</label>
                                    </div>
                                    <div class="flex items-center">
                                        <input type="checkbox" name="use_llm" id="useLLMCheckbox" value="true"
                                               class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                                        <label for="useLLMCheckbox" class="ml-2 block text-sm text-gray-700">启用AI整理</label>
                                    </div>
                                </div>
                            </div>
                        </form>

                        <!-- 搜索结果 -->
                        <div class="mt-6">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-lg font-semibold text-gray-800">检索结果</h3>
                                <div id="searchStats" class="text-sm text-gray-500">
                                    <!-- 搜索统计信息将通过JavaScript动态加载 -->
                                </div>
                            </div>
                            <div id="searchResults" class="space-y-4">
                                <div class="text-center py-8">
                                    <i class="fas fa-search text-gray-400 text-2xl"></i>
                                    <p class="mt-2 text-gray-500">提问后将显示相关检索结果</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white shadow-inner mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="flex items-center mb-4 md:mb-0">
                    <i class="fas fa-book-open text-indigo-600 text-xl mr-2"></i>
                    <span class="text-lg font-medium text-gray-800">智能文档检索系统</span>
                </div>
                <div class="flex space-x-6">
                    <a href="#" class="text-gray-500 hover:text-indigo-600 transition">隐私政策</a>
                    <a href="#" class="text-gray-500 hover:text-indigo-600 transition">使用条款</a>
                    <a href="#" class="text-gray-500 hover:text-indigo-600 transition">联系我们</a>
                </div>
            </div>
            <div class="mt-4 text-center md:text-left text-sm text-gray-500">
                &copy; 2023 智能文档检索系统. 保留所有权利.
            </div>
        </div>
    </footer>

    <script>
        // 添加调试模式开关
        const DEBUG_MODE = true;
        
        function debugLog(...args) {
            if (DEBUG_MODE) {
                console.log("[DEBUG]", ...args);
            }
        }
        
        // 页面加载时获取项目列表
        document.addEventListener('DOMContentLoaded', function() {
            // 确保表单元素存在
            const uploadForm = document.getElementById('uploadForm');
            
            if (!uploadForm) {
                console.error('错误：找不到上传表单元素');
                return;
            }
            
            console.log('成功找到上传表单');
            
            // 绑定提交事件
            uploadForm.addEventListener('submit', function(e) {
                console.log('表单提交事件触发 - 开始处理');
                
                // 阻止默认表单行为（关键）
                e.preventDefault();
                console.log('已阻止默认表单行为');
                
                const form = this;
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn.innerHTML;
                
                // 显示加载状态
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> 处理中...`;
                
                // 记录表单数据（调试用）
                const formData = new FormData(form);
                console.log('表单数据:');
                for (const [key, value] of formData.entries()) {
                    if (key === 'files') {
                        console.log(`文件: ${value.name} (${value.size} bytes)`);
                    } else {
                        console.log(`${key}: ${value}`);
                    }
                }
                
                // 发送请求
                fetch('/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    console.log(`收到响应，状态码: ${response.status}`);
                    
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.error || `服务器错误: ${response.status}`);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('响应数据:', data);
                    
                    if (!data.success) {
                        throw new Error(data.error || '上传失败');
                    }
                    
                    showNotification('success', data.message);
                    form.reset();
                    
                    if (typeof fetchFilteredProjects === 'function') {
                        fetchFilteredProjects();
                    }
                })
                .catch(error => {
                    console.error('上传错误:', error);
                    showNotification('error', error.message);
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnText;
                    console.log('表单处理完成');
                });
            });
            
            // 添加筛选按钮事件处理（关键修复）
            document.getElementById('addProjectFilterBtn').addEventListener('click', function() {
                const value = document.getElementById('projectNameFilter').value.trim();
                if (value) {
                    addConstraint('project_name', value);
                    document.getElementById('projectNameFilter').value = '';
                } else {
                    showNotification('error', '请输入项目名称或编号');
                }
            });

            document.getElementById('addFeatureFilterBtn').addEventListener('click', function() {
                const value = document.getElementById('projectFeatureFilter').value.trim();
                if (value) {
                    addConstraint('feature', value);
                    document.getElementById('projectFeatureFilter').value = '';
                } else {
                    showNotification('error', '请输入项目特点');
                }
            });

            document.getElementById('addTimeFilterBtn').addEventListener('click', function() {
                const value = document.getElementById('projectTimeFilter').value.trim();
                if (value) {
                    addConstraint('time_range', value);
                    document.getElementById('projectTimeFilter').value = '';
                } else {
                    showNotification('error', '请输入时间范围');
                }
            });

            // 绑定清除上下文按钮
            document.getElementById('clearContextBtn').addEventListener('click', clearAllConstraints);

            // 绑定发送问题按钮
            document.getElementById('sendQuestionBtn').addEventListener('click', sendQuestion);
            
            // 绑定回车键发送问题
            document.getElementById('questionInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendQuestion();
                }
            });

            // 初始化上下文和项目列表
            fetchContext();
            fetchFilteredProjects();
        });

        // 添加约束条件
        function addConstraint(type, value) {
            fetch('/context/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ constraint_type: type, value: value })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.error || '添加约束失败') });
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    showNotification('success', `已添加筛选条件: ${formatConstraint(type, value)}`);
                    fetchContext(); // 刷新上下文显示
                    fetchFilteredProjects();  // 新增：更新项目列表
                } else {
                    throw new Error(data.error || '添加约束失败');
                }
            })
            .catch(error => {
                showNotification('error', '添加筛选条件失败: ' + error.message);
            });
        }
        
        // 清除所有约束条件
        function clearAllConstraints() {
            fetch('/context/clear', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotification('success', '已清除所有筛选条件');
                    fetchContext(); // 刷新上下文显示
                    fetchFilteredProjects();  // 新增：恢复所有项目
                }
            })
            .catch(error => {
                showNotification('error', '清除筛选条件失败: ' + error.message);
            });
        }
        
        // 发送问题
        function sendQuestion() {
            const question = document.getElementById('questionInput').value.trim();
            if (!question) {
                showNotification('error', '请输入问题内容');
                return;
            }
            
            // 获取搜索选项
            const rerankEnabled = document.getElementById('rerankCheckbox').checked;
            const useLLM = document.getElementById('useLLMCheckbox').checked;
            
            // 添加用户问题到聊天记录
            addToChatHistory('user', question);
            
            // 清空输入框
            document.getElementById('questionInput').value = '';
            
            // 显示加载状态
            addToChatHistory('loading', '正在处理您的问题...');
            
            fetch('/query', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    question: question,
                    rerank: rerankEnabled,
                    use_llm: useLLM
                })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.error || '查询失败') });
                }
                return response.json();
            })
            .then(data => {
                if (!data.success) {
                    throw new Error(data.error || '查询失败');
                }
                
                // 移除加载状态
                removeLoadingMessage();
                
                // 添加AI回答到聊天记录
                addToChatHistory('ai', data.response.answer);
                
                // 显示搜索结果
                if (data.response.results && data.response.results.length > 0) {
                    displaySearchResults(
                        data.response.results, 
                        rerankEnabled, 
                        useLLM
                    );
                    
                    // 更新搜索统计
                    document.getElementById('searchStats').innerHTML = `
                        <span>找到 ${data.response.results.length} 条结果</span>
                        ${rerankEnabled ? '<span class="ml-2 text-blue-600"><i class="fas fa-sort-amount-down"></i> 已重排序</span>' : ''}
                        ${useLLM ? '<span class="ml-2 text-purple-600"><i class="fas fa-robot"></i> AI整理</span>' : ''}
                    `;
                } else {
                    document.getElementById('searchResults').innerHTML = `
                        <div class="text-center py-8 text-gray-500">
                            <i class="fas fa-search text-2xl"></i>
                            <p class="mt-2">没有找到匹配的结果</p>
                        </div>
                    `;
                    document.getElementById('searchStats').innerHTML = '';
                }
                
                // 刷新上下文显示
                fetchContext();
            })
            .catch(error => {
                // 移除加载状态
                removeLoadingMessage();
                
                // 显示错误信息
                addToChatHistory('error', error.message);
                showNotification('error', '查询失败: ' + error.message);
            });
        }
        
        // 添加到聊天记录
        function addToChatHistory(sender, content) {
            const chatHistory = document.getElementById('chatHistory');
            
            // 首次提问时清空初始提示
            if (chatHistory.querySelector('.text-center') && sender === 'user') {
                chatHistory.innerHTML = '';
            }
            
            const messageDiv = document.createElement('div');
            
            if (sender === 'loading') {
                messageDiv.className = 'flex justify-start fade-in';
                messageDiv.innerHTML = `
                    <div class="chat-bubble-ai p-4">
                        <div class="flex items-center text-green-700 mb-2">
                            <i class="fas fa-spinner fa-spin mr-2"></i>
                            <span class="font-medium">系统处理中</span>
                        </div>
                        <p class="text-gray-700">${content}</p>
                    </div>
                `;
                messageDiv.id = 'loadingMessage';
            } 
            else if (sender === 'error') {
                messageDiv.className = 'flex justify-start fade-in';
                messageDiv.innerHTML = `
                    <div class="bg-red-50 border-l-4 border-red-400 p-4 rounded-r-lg max-w-85%">
                        <div class="flex items-center text-red-700 mb-2">
                            <i class="fas fa-exclamation-circle mr-2"></i>
                            <span class="font-medium">错误</span>
                        </div>
                        <p class="text-red-700">${content}</p>
                    </div>
                `;
            }
            else {
                const isUser = sender === 'user';
                messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'} fade-in`;
                messageDiv.innerHTML = `
                    <div class="${isUser ? 'chat-bubble-user' : 'chat-bubble-ai'} p-4">
                        <div class="flex items-center ${isUser ? 'text-blue-700' : 'text-green-700'} mb-2">
                            <i class="fas ${isUser ? 'fa-user' : 'fa-robot'} mr-2"></i>
                            <span class="font-medium">${isUser ? '您' : '系统'}</span>
                        </div>
                        <div class="markdown-style text-gray-800">
                            ${content}
                        </div>
                    </div>
                `;
            }
            
            chatHistory.appendChild(messageDiv);
            
            // 滚动到底部
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
        
        // 移除加载消息
        function removeLoadingMessage() {
            const loadingMsg = document.getElementById('loadingMessage');
            if (loadingMsg) {
                loadingMsg.remove();
            }
        }
        
        // 获取上下文信息
        function fetchContext() {
            fetch('/context')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        updateContextUI(data.context);
                    }
                })
                .catch(error => {
                    console.error('获取上下文失败:', error);
                });
        }
        
        // 更新上下文UI
        function updateContextUI(context) {
            const constraintTags = document.getElementById('constraintTags');
            
            if (!context || !context.constraints || context.constraints.length === 0) {
                constraintTags.innerHTML = '<p>无筛选条件（所有项目）</p>';
                return;
            }
            
            let html = '';
            context.constraints.forEach((constraint, index) => {
                html += `
                    <span class="constraint-tag">
                        ${formatConstraint(constraint.type, constraint.value)}
                        <button onclick="removeConstraint(${index})">
                            <i class="fas fa-times text-xs"></i>
                        </button>
                    </span>
                `;
            });
            
            constraintTags.innerHTML = html;
        }
        
        // 格式化约束条件显示
        function formatConstraint(type, value) {
            const typeNames = {
                'project_name': '项目名称',
                'time_range': '时间范围',
                'feature': '项目特点'
            };
            
            return `${typeNames[type] || type}: ${value}`;
        }
        
        // 移除单个约束条件
        function removeConstraint(index) {
            fetch(`/context/remove/${index}`, {
                method: 'POST'
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.error || '移除约束失败') });
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    fetchContext(); // 刷新上下文显示
                    fetchFilteredProjects();  // 新增：更新项目列表
                    showNotification('success', '已移除筛选条件');
                }
            })
            .catch(error => {
                showNotification('error', '移除筛选条件失败: ' + error.message);
            });
        }
        
        // 获取项目列表并更新UI
        function fetchFilteredProjects() {
            debugLog("根据当前筛选条件请求项目列表...");
            const projectsContainer = document.getElementById('projectsContainer');
            
            // 显示加载状态
            projectsContainer.innerHTML = `
                <div class="text-center py-8">
                    <i class="fas fa-spinner fa-spin text-gray-400 text-2xl"></i>
                    <p class="mt-2 text-gray-500">加载项目中...</p>
                </div>
            `;

            // 请求后端接口，获取符合当前约束的项目
            fetch('/projects/filtered')  // 新增接口：返回符合筛选条件的项目
                .then(response => {
                    debugLog("筛选后项目响应状态:", response.status);
                    if (!response.ok) {
                        throw new Error('获取筛选项目失败');
                    }
                    return response.json();
                })
                .then(data => {
                    debugLog("接收到的筛选后项目数据:", data);
                    renderProjectCards(data);  // 用精简的renderProjectCards渲染
                })
                .catch(error => {
                    console.error('筛选项目加载失败:', error);
                    projectsContainer.innerHTML = `
                        <div class="text-center py-8 text-red-500">
                            <i class="fas fa-exclamation-circle text-2xl"></i>
                            <p class="mt-2">项目加载失败: ${error.message}</p>
                        </div>
                    `;
                });
        }
        
        // 渲染项目卡片（新增项目编号显示）
        function renderProjectCards(projects) {
            const container = document.getElementById('projectsContainer');
            
            if (!Array.isArray(projects)) {
                container.innerHTML = `
                    <div class="text-center py-8 text-red-500">
                        <i class="fas fa-exclamation-circle text-2xl"></i>
                        <p class="mt-2">项目数据格式无效</p>
                    </div>
                `;
                return;
            }

            // 按项目名称字母排序（忽略大小写）
            const sortedProjects = [...projects].sort((a, b) => {
                const nameA = (a.name || '').toLowerCase();
                const nameB = (b.name || '').toLowerCase();
                return nameA.localeCompare(nameB);
            });

            if (sortedProjects.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-folder-open text-2xl"></i>
                        <p class="mt-2">暂无项目</p>
                        <p class="text-sm mt-1">上传文档以创建新项目</p>
                    </div>
                `;
                return;
            }
            
            // 生成精简项目卡片（新增项目编号显示）
            container.innerHTML = '';
            sortedProjects.forEach(project => {
                const name = project.name || "未命名项目";
                const code = project.project_code || "无编号";
                
                const card = document.createElement('div');
                card.className = 'project-card bg-white border border-gray-200 rounded-lg p-3 hover:bg-gray-50 transition flex justify-between items-center';
                card.innerHTML = `
                    <div class="flex flex-col flex-grow">
                        <div class="flex items-center">
                            <i class="fas fa-folder text-indigo-400 mr-2"></i>
                            <span class="project-name text-gray-800 font-medium truncate">${name}</span>
                        </div>
                        <div class="mt-1">
                            <span class="project-code text-xs">${code}</span>
                        </div>
                    </div>
                    <div class="flex space-x-1 ml-2">
                        <button onclick="setProjectContext('${name}')" 
                                title="筛选该项目"
                                class="p-1.5 text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50 rounded transition">
                            <i class="fas fa-filter text-sm"></i>
                        </button>
                        <button onclick="viewProjectDetails('${name}')" 
                                title="查看详情"
                                class="p-1.5 text-gray-600 hover:text-gray-800 hover:bg-gray-50 rounded transition">
                            <i class="fas fa-info-circle text-sm"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        // 设置项目上下文
        function setProjectContext(projectName) {
            addConstraint('project_name', projectName);
        }
        
        // 查看项目详情（新增项目编号显示）
        function viewProjectDetails(name) {
            fetch(`/project/${encodeURIComponent(name)}`)
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.error || '获取项目详情失败') });
                    }
                    return response.json();
                })
                .then(data => {
                    // 处理项目详情数据
                    const files = data.files || [];
                    const docCount = data.document_count || 0;
                    const fileCount = data.file_count || files.length || 0;
                    const lastUpdated = data.last_updated || '未知';
                    const description = data.description || '该项目暂无描述信息';
                    const projectCode = data.project_code || '无';
                    
                    // 创建模态框显示详情
                    const modal = document.createElement('div');
                    modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4';
                    modal.innerHTML = `
                        <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[80vh] overflow-y-auto">
                            <div class="p-6">
                                <div class="flex justify-between items-center mb-4">
                                    <h3 class="text-xl font-bold text-gray-800">
                                        <i class="fas fa-folder-open text-indigo-500 mr-2"></i>
                                        ${name}
                                    </h3>
                                    <button onclick="this.parentElement.parentElement.parentElement.remove()" 
                                            class="text-gray-400 hover:text-gray-600">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                                <div class="space-y-4">
                                    <div>
                                        <h4 class="text-sm font-medium text-gray-500">项目描述</h4>
                                        <p class="mt-1 text-gray-700">${description}</p>
                                    </div>
                                    <div>
                                        <h4 class="text-sm font-medium text-gray-500">项目编号</h4>
                                        <p class="mt-1 text-gray-700 font-mono">${projectCode}</p>
                                    </div>
                                    <div>
                                        <h4 class="text-sm font-medium text-gray-500">文件列表</h4>
                                        <ul class="mt-2 space-y-1 max-h-[200px] overflow-y-auto">
                                            ${files.length > 0 ? 
                                                files.map(file => `
                                                    <li class="flex items-center py-1 px-2 hover:bg-gray-50 rounded">
                                                        <i class="fas fa-file-word text-indigo-400 mr-2"></i>
                                                        <span class="truncate">${file}</span>
                                                    </li>
                                                `).join('') : 
                                                '<li class="text-gray-500 py-2">暂无文件</li>'}
                                        </ul>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div class="bg-indigo-50 p-3 rounded-lg">
                                            <p class="text-xs text-indigo-600">文档片段</p>
                                            <p class="text-xl font-semibold text-indigo-800">${docCount}</p>
                                        </div>
                                        <div class="bg-indigo-50 p-3 rounded-lg">
                                            <p class="text-xs text-indigo-600">文件数量</p>
                                            <p class="text-xl font-semibold text-indigo-800">${fileCount}</p>
                                        </div>
                                    </div>
                                    <div class="text-sm text-gray-500">
                                        <p><i class="far fa-clock mr-1"></i> 最后更新: ${lastUpdated}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-gray-50 px-4 py-3 flex justify-end">
                                <button onclick="this.parentElement.parentElement.remove()"
                                        class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition">
                                    关闭
                                </button>
                            </div>
                        </div>
                    `;
                    document.body.appendChild(modal);
                })
                .catch(error => {
                    showNotification('error', '获取项目详情失败: ' + error.message);
                });
        }
        
        // 显示搜索结果
        function displaySearchResults(results, rerankEnabled = false, useLLM = false) {
            const container = document.getElementById('searchResults');
            
            if (!Array.isArray(results) || results.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-search text-2xl"></i>
                        <p class="mt-2">没有找到匹配的结果</p>
                        <p class="text-sm mt-1">尝试修改搜索条件</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            // 根据重排序状态显示不同提示
            if (rerankEnabled) {
                const rerankNotice = document.createElement('div');
                rerankNotice.className = 'rerank-indicator p-3 rounded-lg mb-4 flex items-center';
                rerankNotice.innerHTML = `
                    <i class="fas fa-sort-amount-down-alt text-blue-500 mr-2"></i>
                    <span>已启用重排序，结果按相关性优化</span>
                `;
                container.appendChild(rerankNotice);
            }
            
            results.forEach((result, index) => {
                const item = document.createElement('div');
                item.className = `bg-white rounded-lg p-4 shadow-sm fade-in ${index > 0 ? 'mt-4' : ''}`;
                
                // 重排序相关元素
                const rerankInfo = rerankEnabled && result.rerank_score ? `
                    <div class="text-xs text-blue-600 mt-1">
                        <i class="fas fa-sort-amount-down-alt mr-1"></i>
                        重排序分数: ${result.rerank_score.toFixed(4)}
                    </div>
                ` : '';
                
                // 匹配度显示（优先使用重排序分数）
                const matchScore = rerankEnabled && result.rerank_score ? 
                    result.rerank_score : 
                    result.distance || 0;
                    
                const matchPercent = Math.round(matchScore * 100);
                
                // 构建结果内容
                let contentHtml = `
                    <details class="group" ${index < 3 ? 'open' : ''}>
                        <summary class="flex items-center cursor-pointer text-sm text-gray-600 hover:text-indigo-700">
                            <span>查看原始内容</span>
                            <i class="fas fa-chevron-down ml-1 transform group-open:rotate-180 transition text-xs"></i>
                        </summary>
                        <div class="mt-2 p-3 bg-gray-50 rounded text-sm text-gray-700 border border-gray-200">
                            ${result.content || '无内容'}
                        </div>
                    </details>
                `;
                
                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-100 text-indigo-800">
                                    ${result.project_name || '未知项目'}
                                </span>
                                <span class="ml-2 text-xs text-gray-500">
                                    <i class="far fa-file-word mr-1"></i> ${result.filename || '未命名文件'}
                                </span>
                            </div>
                            <h4 class="mt-1 font-medium text-gray-800">${result.chapter_title || '无章节标题'}</h4>
                            ${result.subsection_title ? `<p class="text-sm text-gray-600">${result.subsection_title}</p>` : ''}
                            ${rerankInfo}
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-xs font-medium px-2 py-1 rounded bg-green-100 text-green-800">
                                ${matchPercent}% 匹配
                            </span>
                            ${rerankEnabled ? `
                                <span class="text-xs text-blue-600 mt-1">
                                    <i class="fas fa-sort-amount-down"></i>
                                </span>
                            ` : ''}
                        </div>
                    </div>
                    <div class="mt-3">
                        ${contentHtml}
                    </div>
                `;
                container.appendChild(item);
            });
        }
        
        // 显示通知
        function showNotification(type, message) {
            const notification = document.createElement('div');
            const colors = {
                success: 'bg-green-100 border-green-400 text-green-700',
                error: 'bg-red-100 border-red-400 text-red-700',
                info: 'bg-blue-100 border-blue-400 text-blue-700'
            };
            
            notification.className = `fixed top-4 right-4 border-l-4 ${colors[type] || colors.info} px-4 py-3 rounded shadow-lg z-50 max-w-xs transition transform fade-in`;
            notification.innerHTML = `
                <div class="flex items-center">
                    <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'} mr-2"></i>
                    <p>${message}</p>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // 自动消失
            setTimeout(() => {
                notification.classList.add('opacity-0', 'translate-x-full');
                setTimeout(() => notification.remove(), 300);
            }, 5000);
        }
    </script>
</body>
</html>
